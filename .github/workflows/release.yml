name: Release builds
on:
  push:
jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package_target:
          - trixie-amd64
          - bookworm-amd64
          - bullseye-amd64
          - resolute-amd64
          - noble-amd64
          - jammy-amd64
          - focal-amd64
      fail-fast: false
    steps:
      - name: configure docker
        run:  |
          echo '{ "experimental": true }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: checkout packaging
        uses: actions/checkout@v4
        with:
          path: packaging
      - name: checkout wkhtmltopdf with submodules
        uses: actions/checkout@v4
        with:
          repository: wkhtmltopdf/wkhtmltopdf
          path: wkhtmltopdf
          submodules: true
          ref: 0.12.6.x
      - name: build
        run: cd packaging && python3 ./build package-docker --clean ${{ matrix.package_target }} ../wkhtmltopdf
      - name: create version based on current date
        id: date
        shell: bash
        run: |
          today=$(TZ='Europe/Amsterdam' date +'%Y-%m-%d')
          version=$(echo $today | sed 's/-0*/./g')
          echo "today=${today}"
          echo "version=${version}"
          echo "today=${today}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT
      - name: release
        if: github.ref_name == 'master'
        uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.date.outputs.today }}
          commit: ${{ github.sha }}
          tag: ${{ steps.date.outputs.today }}
          body: "Builds of wkhtmltopdf (0.12.6.x branch) for debian and ubuntu (amd64). [build run](${{github.event.repository.html_url}}/actions/runs/${{github.run_id}})"
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "packaging/targets/*"
